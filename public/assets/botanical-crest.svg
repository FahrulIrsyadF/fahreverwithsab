<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#6B4E0B"/>
    </linearGradient>
    <linearGradient id="goldShimmer" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF0C5"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8E6516"/>
    </linearGradient>

    <!-- Emerald Foliage Gradients -->
    <linearGradient id="deepEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="softEucalyptus" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="centerStamen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="goldDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#AA771C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- GEOMETRIC POLYGON GOLD FRAME (TRANSPARENT BACKGROUND) -->
  <g id="geometric-frames" filter="url(#goldDropShadow)">
    <!-- Outer Octagon/Hexagon Multi-Facet Frame -->
    <polygon points="250,35 390,95 440,230 395,380 250,455 105,380 60,230 110,95" 
             fill="none" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Intersecting Secondary Diamond/Facet Frame -->
    <polygon points="250,55 425,230 250,435 75,230" 
             fill="none" stroke="url(#goldShimmer)" stroke-width="1.5" stroke-dasharray="none" opacity="0.85"/>
    <polygon points="250,45 405,105 450,230 405,370 250,445 95,370 50,230 95,105" 
             fill="none" stroke="url(#goldLinear)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- TOP RIGHT BOTANICAL SPRAY (White Lily & Ferns) -->
  <g id="top-right-bouquet">
    <!-- Fern branches -->
    <path d="M 370,120 Q 430,70 470,60" fill="none" stroke="#065f46" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Fronds -->
    <path d="M 390,105 C 415,95 435,75 440,65 C 425,78 408,90 393,98" fill="url(#deepEmerald)"/>
    <path d="M 410,95 C 438,82 458,62 462,50 C 445,66 428,80 412,87" fill="url(#softEucalyptus)"/>
    <path d="M 430,80 C 452,70 470,55 475,42 C 460,56 442,68 429,74" fill="url(#deepEmerald)"/>

    <!-- Eucalyptus branch & round leaves -->
    <path d="M 350,150 Q 400,130 430,100" fill="none" stroke="#047857" stroke-width="2"/>
    <ellipse cx="370" cy="130" rx="14" ry="10" transform="rotate(-25 370 130)" fill="url(#softEucalyptus)" stroke="url(#goldLinear)" stroke-width="0.8"/>
    <ellipse cx="395" cy="118" rx="15" ry="11" transform="rotate(15 395 118)" fill="url(#deepEmerald)" stroke="url(#goldLinear)" stroke-width="0.8"/>
    <ellipse cx="420" cy="102" rx="12" ry="9" transform="rotate(-10 420 102)" fill="url(#softEucalyptus)"/>

    <!-- Elegant White Lily Blossom -->
    <g id="white-lily-top" transform="translate(390, 110) scale(0.9)">
      <path d="M 0,0 C -15,-30 -10,-60 5,-75 C 15,-55 12,-25 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.6"/>
      <path d="M 0,0 C -35,-20 -60,-15 -75,0 C -55,10 -25,8 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.6"/>
      <path d="M 0,0 C -25,25 -30,55 -20,70 C -5,55 0,25 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.6"/>
      <path d="M 0,0 C 25,20 55,20 70,5 C 55,-5 25,-5 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.6"/>
      <path d="M 0,0 C 20,-25 35,-50 35,-65 C 20,-45 5,-20 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.6"/>
      <!-- Pistil & Stamens -->
      <circle cx="0" cy="0" r="4" fill="url(#centerStamen)"/>
      <line x1="0" y1="0" x2="-8" y2="-25" stroke="#d97706" stroke-width="1.2"/>
      <circle cx="-8" cy="-25" r="2" fill="#b45309"/>
      <line x1="0" y1="0" x2="10" y2="-20" stroke="#d97706" stroke-width="1.2"/>
      <circle cx="10" cy="-20" r="2" fill="#b45309"/>
      <line x1="0" y1="0" x2="-20" y2="-5" stroke="#d97706" stroke-width="1.2"/>
      <circle cx="-20" cy="-5" r="2" fill="#b45309"/>
    </g>
  </g>

  <!-- BOTTOM LEFT BOTANICAL SPRAY (Large White Lily, Eucalyptus & Ferns) -->
  <g id="bottom-left-bouquet">
    <!-- Fern branches extending down and left -->
    <path d="M 140,360 Q 70,410 40,440" fill="none" stroke="#065f46" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 120,380 C 95,395 75,415 60,430 C 78,415 98,400 115,385" fill="url(#deepEmerald)"/>
    <path d="M 100,395 C 75,412 55,432 45,450 C 62,430 82,415 95,402" fill="url(#softEucalyptus)"/>
    <path d="M 80,412 C 60,428 42,445 35,460 C 50,442 70,428 78,418" fill="url(#deepEmerald)"/>

    <!-- Eucalyptus Stems & Round Leaf Clusters -->
    <path d="M 160,330 Q 100,345 65,370" fill="none" stroke="#047857" stroke-width="2"/>
    <ellipse cx="130" cy="345" rx="16" ry="11" transform="rotate(-35 130 345)" fill="url(#softEucalyptus)" stroke="url(#goldLinear)" stroke-width="0.8"/>
    <ellipse cx="105" cy="358" rx="17" ry="12" transform="rotate(20 105 358)" fill="url(#deepEmerald)" stroke="url(#goldLinear)" stroke-width="0.8"/>
    <ellipse cx="80" cy="372" rx="14" ry="10" transform="rotate(-15 80 372)" fill="url(#softEucalyptus)"/>
    <ellipse cx="145" cy="320" rx="15" ry="10" transform="rotate(40 145 320)" fill="url(#deepEmerald)"/>

    <!-- Large White Lily Blossom (Bottom Left) -->
    <g id="white-lily-bottom" transform="translate(145, 360) scale(1.1)">
      <path d="M 0,0 C -20,-35 -15,-70 5,-90 C 20,-65 15,-30 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.7"/>
      <path d="M 0,0 C -45,-25 -75,-20 -95,0 C -70,12 -35,10 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.7"/>
      <path d="M 0,0 C -30,30 -35,70 -20,90 C -5,70 0,35 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.7"/>
      <path d="M 0,0 C 30,25 70,25 90,5 C 70,-8 35,-8 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.7"/>
      <path d="M 0,0 C 25,-30 45,-60 45,-80 C 25,-55 8,-25 0,0" fill="url(#petalGrad)" stroke="#cbd5e1" stroke-width="0.7"/>
      <!-- Inner Stamen & Gold Anthers -->
      <circle cx="0" cy="0" r="5" fill="url(#centerStamen)"/>
      <line x1="0" y1="0" x2="-10" y2="-30" stroke="#d97706" stroke-width="1.4"/>
      <circle cx="-10" cy="-30" r="2.5" fill="#b45309"/>
      <line x1="0" y1="0" x2="12" y2="-25" stroke="#d97706" stroke-width="1.4"/>
      <circle cx="12" cy="-25" r="2.5" fill="#b45309"/>
      <line x1="0" y1="0" x2="-25" y2="-6" stroke="#d97706" stroke-width="1.4"/>
      <circle cx="-25" cy="-6" r="2.5" fill="#b45309"/>
      <line x1="0" y1="0" x2="20" y2="15" stroke="#d97706" stroke-width="1.4"/>
      <circle cx="20" cy="15" r="2.5" fill="#b45309"/>
    </g>
  </g>

  <!-- FLOATING GOLD DUST & SHIMMER PARTICLES -->
  <g id="gold-glitter">
    <circle cx="180" cy="90" r="2.5" fill="url(#goldLinear)"/>
    <circle cx="210" cy="65" r="1.5" fill="url(#goldLinear)" opacity="0.8"/>
    <circle cx="310" cy="75" r="2" fill="url(#goldLinear)"/>
    <circle cx="430" cy="180" r="2" fill="url(#goldLinear)" opacity="0.9"/>
    <circle cx="455" cy="210" r="1.5" fill="url(#goldLinear)" opacity="0.7"/>
    <circle cx="420" cy="320" r="2.5" fill="url(#goldLinear)"/>
    <circle cx="380" cy="405" r="1.8" fill="url(#goldLinear)" opacity="0.8"/>
    <circle cx="320" cy="430" r="2.5" fill="url(#goldLinear)"/>
    <circle cx="180" cy="430" r="2" fill="url(#goldLinear)" opacity="0.8"/>
    <circle cx="95" cy="300" r="2" fill="url(#goldLinear)"/>
    <circle cx="75" cy="180" r="2.5" fill="url(#goldLinear)" opacity="0.9"/>
    <circle cx="120" cy="130" r="1.5" fill="url(#goldLinear)" opacity="0.7"/>
    <!-- Star glimmers -->
    <path d="M 250,25 L 253,32 L 260,35 L 253,38 L 250,45 L 247,38 L 240,35 L 247,32 Z" fill="url(#goldLinear)"/>
    <path d="M 450,230 L 452,235 L 457,237 L 452,239 L 450,444 L 448,239 L 443,237 L 448,235 Z" fill="url(#goldLinear)" opacity="0.8"/>
    <path d="M 250,455 L 252,460 L 257,462 L 252,464 L 250,469 L 248,464 L 243,462 L 248,460 Z" fill="url(#goldLinear)"/>
  </g>
</svg>